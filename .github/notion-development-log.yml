name: Log merged PR to Notion

on:
  pull_request:
    types:
      - closed

jobs:
  log-to-notion:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Create linked Notion Development Log entry
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DEVELOPMENT_LOG_ID: ${{ secrets.NOTION_DEVELOPMENT_LOG_ID }}
          NOTION_PROJECTS_ID: ${{ secrets.NOTION_PROJECTS_ID }}

          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPOSITORY: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          NOTION_VERSION = "2026-03-11"

          def notion_request(url, payload=None):
              data = None

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=data,
                  method="POST" if payload is not None else "GET",
                  headers={
                      "Authorization": f"Bearer {os.environ['NOTION_TOKEN']}",
                      "Content-Type": "application/json",
                      "Notion-Version": NOTION_VERSION,
                  },
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  print("Notion API request failed.")
                  print("Status:", error.code)
                  print(error.read().decode("utf-8"))
                  raise

          repository = os.environ["REPOSITORY"]

          repository_to_project = {
              "xr08/project-spotlight": "Project Spotlight",
              "xr08/inswinger": "Inswinger",
              "xr08/Sport-Scoresheet-Analysis": "Softball Scoresheet Analysis",
              "xr08/structured-extraction-lab": "Structured Extraction Lab",
              "xr08/fremantle-rebels-site": "Fremantle Rebels Website",
              "xr08/rebels-command-center": "Rebels Command Center",
              "xr08/Softball-Analysis-Lab": "Softball Analysis Lab",
              "xr08/Fantasy-App": "Fantasy App",
          }

          project_name = repository_to_project.get(repository)

          if not project_name:
              raise RuntimeError(
                  f"No Notion project mapping configured for repository: {repository}"
              )

          project_query = {
              "filter": {
                  "property": "Project",
                  "title": {
                      "equals": project_name
                  }
              },
              "page_size": 1
          }

          project_result = notion_request(
              f"https://api.notion.com/v1/data_sources/"
              f"{os.environ['NOTION_PROJECTS_ID']}/query",
              project_query,
          )

          results = project_result.get("results", [])

          if not results:
              raise RuntimeError(
                  f'Could not find project "{project_name}" in Notion.'
              )

          project_page_id = results[0]["id"]

          title = os.environ.get("PR_TITLE") or "Merged pull request"
          body = (
              os.environ.get("PR_BODY")
              or "No pull request description was provided."
          )
          pr_url = os.environ["PR_URL"]
          author = os.environ["AUTHOR"]
          merged_at = os.environ["MERGED_AT"]

          summary = (
              f"Repository: {repository}\n"
              f"Author: {author}\n\n"
              f"{body}"
          )[:1900]

          payload = {
              "parent": {
                  "type": "data_source_id",
                  "data_source_id": os.environ["NOTION_DEVELOPMENT_LOG_ID"],
              },
              "properties": {
                  "Entry": {
                      "title": [
                          {
                              "text": {
                                  "content": f"Merged PR: {title}"[:200]
                              }
                          }
                      ]
                  },
                  "Project": {
                      "relation": [
                          {
                              "id": project_page_id
                          }
                      ]
                  },
                  "Date": {
                      "date": {
                          "start": merged_at
                      }
                  },
                  "Type": {
                      "select": {
                          "name": "Merge"
                      }
                  },
                  "Summary": {
                      "rich_text": [
                          {
                              "text": {
                                  "content": summary
                              }
                          }
                      ]
                  },
                  "Source": {
                      "select": {
                          "name": "GitHub"
                      }
                  },
                  "GitHub Link": {
                      "url": pr_url
                  }
              }
          }

          created = notion_request(
              "https://api.notion.com/v1/pages",
              payload,
          )

          print("Created linked Notion entry:", created.get("id"))
          print("Linked project:", project_name)
          PY